<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Subtle grid lines indicating precision / healthcare standards -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

  <!-- Guiding Radiant Star at the summit -->
  <g filter="url(#glow)">
    <path d="M 60 14 L 63 25 L 74 28 L 63 31 L 60 42 L 57 31 L 46 28 L 57 25 Z" fill="url(#goldGrad)" />
    <circle cx="60" cy="28" r="3" fill="#ffffff" />
  </g>

  <!-- Background Mountain Peak (Edge) -->
  <polygon points="26,92 60,34 94,92" fill="url(#mountainBack)" opacity="0.85" />
  
  <!-- Back Peak Snowcap -->
  <polygon points="60,34 52,48 56,46 60,50 64,46 68,48" fill="#ffffff" opacity="0.9" />

  <!-- Foreground Mountain Peak -->
  <polygon points="38,92 68,44 100,92" fill="url(#mountainFront)" />
  
  <!-- Foreground Snowcap -->
  <polygon points="68,44 61,56 65,54 68,58 72,54 76,56" fill="#ffffff" />

  <!-- Open Book of Knowledge / Curriculum at the base -->
  <path d="M 32 94 C 44 88 56 88 60 91 C 64 88 76 88 88 94 L 88 84 C 76 78 64 78 60 81 C 56 78 44 78 32 84 Z" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5" />
  <line x1="60" y1="81" x2="60" y2="92" stroke="#0284c7" stroke-width="2" />

  <!-- Medical / Nursing Red-Cross / Caduceus Star Accent -->
  <rect x="57" y="66" width="6" height="14" rx="1.5" fill="#f43f5e" />
  <rect x="53" y="70" width="14" height="6" rx="1.5" fill="#f43f5e" />
  <circle cx="60" cy="73" r="2" fill="#ffffff" />
</svg>
