<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#avatarBg)" stroke="#38bdf8" stroke-width="3" />

  <!-- Scrub / Clinical Uniform Body -->
  <path d="M 22 96 C 22 75 34 68 50 68 C 66 68 78 75 78 96 Z" fill="url(#scrubGrad)" />

  <!-- Scrub V-Neck -->
  <polygon points="50,78 41,68 59,68" fill="#f8fafc" />
  <polygon points="50,76 43,68 57,68" fill="#0284c7" />

  <!-- Stethoscope around neck -->
  <path d="M 37 68 C 37 77 42 84 50 84 C 58 84 63 77 63 68" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="85" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />

  <!-- Head / Face -->
  <ellipse cx="50" cy="46" rx="19" ry="21" fill="url(#skinGrad)" />

  <!-- Hair / Professional bun or cap -->
  <path d="M 31 43 C 31 27 41 22 50 22 C 59 22 69 27 69 43 C 66 32 59 29 50 29 C 41 29 34 32 31 43 Z" fill="#1e293b" />
  <ellipse cx="50" cy="20" rx="10" ry="7" fill="#1e293b" />

  <!-- Nursing/Midwifery White Cross Peak Pin -->
  <rect x="46" y="15" width="8" height="8" rx="2" fill="#ffffff" />
  <rect x="49" y="17" width="2" height="4" fill="#0284c7" />
  <rect x="48" y="18" width="4" height="2" fill="#0284c7" />

  <!-- Eyes & Smile -->
  <ellipse cx="43" cy="46" rx="2" ry="2.2" fill="#1e293b" />
  <ellipse cx="57" cy="46" rx="2" ry="2.2" fill="#1e293b" />
  <path d="M 45 54 Q 50 58 55 54" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
</svg>
